# keep default prefix (Ctrl + b)

# Terminal true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Start windows and panes from 1.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Keyboard-friendly scrollback and clipboard copy.
set -g escape-time 0
set-window-option -g mode-keys vi
bind y copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# prefix keys
unbind C-b
set-option -g prefix C-_                # Ctrl+/
set-option -g prefix2 M-z
bind-key C-_ send-prefix
bind-key M-z send-prefix -2

# Agent status sidebar (prefix2 = Option-Z, then `a`)
bind a run-shell -b "$HOME/.local/bin/agent-status toggle"

# Splits
bind c new-window -n "#{b:pane_current_path}-cd" -c "#{pane_current_path}"
bind n new-window -n "#{b:pane_current_path}-n" -c "#{pane_current_path}" "nvim"
bind g new-window -n "#{b:pane_current_path}-g" -c "#{pane_current_path}" "sh -c 'lazygit; tmux kill-window'"
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane management
bind x kill-window
bind q confirm-before -p "Kill session #S? (y/n)" "kill-session"
set -g mouse on
# Zoom the OTHER pane (hide current pane) instead of zooming current
bind z run-shell "tmux select-pane -t ':.{next}' && tmux resize-pane -Z"

# Vim-style pane navigation
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# Session management
bind r command-prompt -I "#S" "rename-session '%%'"
bind K confirm-before -p "Kill ALL sessions? (y/n)" "kill-server"
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# key bindings
bind r source-file ~/.config/tmux/tmux.conf

# Pane borders
set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=green
set -g pane-border-lines heavy

# # Status bar
set -g status-style bg=green,fg=black,bold
set -g window-status-style fg=black,bg=green
set -g window-status-current-style fg=green,bg=black,bold
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g status-left ""
set -g status-right ""
# bind -N "Previous session" -n M-Up switch-client -p
# bind -N "Next session" -n M-Down switch-client -n
# Window auto-rename to current folder
set -g automatic-rename on
set -g automatic-rename-format "#{b:#{d:pane_current_path}}/#{b:pane_current_path}"

# Terminal title bar — live parent/current folder, refreshes every second
set -g status-interval 1
# Status bar
set -g status-position bottom
set -g status-interval 5
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10
